title: Out-Of-Tree Kernel Module Tainted Kernel
id: 2b7c1f0e-4d1a-4c33-9a57-7f3e2a9d6c11
status: stable
description: Unsigned / out-of-tree module loaded - common for LKM rootkits (e.g. Diamorphine, Reptile).
author: LinHawk
logsource:
    product: linux
    service: syslog
detection:
    selection:
        EventType: KERNEL_MODULE_TAINT
    filter_known:
        Module:
            - vboxdrv
            - vboxnetflt
            - vboxnetadp
            - nvidia
            - zfs
    condition: selection and not filter_known
falsepositives:
    - Third-party drivers (VirtualBox, NVIDIA, ZFS, EDR agents)
tags:
    - attack.persistence
    - attack.defense-evasion
    - attack.t1547.006
    - attack.t1014
level: high
