title: Logging Daemon Stopped
id: 5e0a8d3c-9b6f-4e21-8c4d-3f1b2a7e9d40
status: stable
author: LinHawk
logsource:
    product: linux
    service: syslog
detection:
    keywords:
        - 'rsyslogd* exiting on signal'
        - 'Stopping System Logging Service'
        - 'Stopped Journal Service'
        - 'auditd*shutting down'
        - 'The audit daemon is exiting'
    condition: keywords
falsepositives:
    - Reboots, package upgrades
tags:
    - attack.defense-evasion
    - attack.t1562.001
level: medium
