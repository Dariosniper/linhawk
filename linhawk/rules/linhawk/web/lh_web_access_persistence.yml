title: Web Login Request
id: b64d898b-3a35-442b-840a-085df92d5c55
name: lh_web_login_post
status: stable
description: Base rule for web login brute force correlation.
author: LinHawk
logsource:
    category: webserver
detection:
    selection:
        cs-method: POST
        cs-uri-stem|contains:
            - wp-login.php
            - xmlrpc.php
            - /login
            - /signin
            - /sign-in
            - /logon
            - /auth
            - /admin
            - /user/login
            - /j_security_check
            - /api/token
    condition: selection
level: informational
