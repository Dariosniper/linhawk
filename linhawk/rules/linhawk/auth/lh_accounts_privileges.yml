title: Sudo Command Executed
id: de2dd9b0-8ec9-43ac-a873-faf925fe664e
status: stable
author: LinHawk
logsource:
    product: linux
    service: sudo
detection:
    selection:
        EventType: SUDO_COMMAND
    filter_error:
        SudoError|exists: true
    condition: selection and not filter_error
level: informational
---
title: Sudo Shell Or Interpreter Spawned As Root
id: 38612b47-79d8-40a4-9c2c-5a1657f7c1db
status: stable
author: LinHawk
logsource:
    product: linux
    service: sudo
detection:
    selection:
        EventType: SUDO_COMMAND
        TargetUser: root
        Command|re: '^(/usr)?/bin/(ba|z|da|k|c|tc|fi)?sh( -[il]+)?$|^(/usr)?/bin/(su|python[0-9.]*|perl|ruby|vi|vim|less|find|awk|env)( |$)'
    condition: selection
falsepositives:
    - Administrators opening a root shell
tags:
    - attack.privilege-escalation
    - attack.t1548.003
level: medium
