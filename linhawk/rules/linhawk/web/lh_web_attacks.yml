title: Cross-Site Scripting Attempt In Web Request
id: 2b8b0a09-abf7-4c3f-b26f-59446d438dd4
status: stable
author: LinHawk
logsource:
    category: webserver
detection:
    selection:
        UriDecoded|re|i: '<\s*script\b|javascript:\s*\w|\bon(error|load|mouseover|focus)\s*=|<\s*(img|svg|iframe)\b[^>]*\bsrc\s*='
    condition: selection
tags:
    - attack.initial-access
    - attack.t1189
level: medium
