title: Log4Shell JNDI Injection Attempt
id: 0c73f75b-b2e1-4cf8-a8a5-e5795afc4fbe
status: stable
description: JNDI lookup (CVE-2021-44228) in URI, User-Agent or Referer, including common obfuscations.
author: LinHawk
logsource:
    category: webserver
detection:
    selection:
        - UriDecoded|contains:
              - '${jndi:'
              - '${${'
              - '${lower:'
              - '${upper:'
              - '${::-j}'
              - '${env:'
        - cs-user-agent|contains:
              - '${jndi:'
              - '${${'
              - '${lower:'
              - '${::-j}'
        - cs-referer|contains:
              - '${jndi:'
              - '${${'
    condition: selection
tags:
    - attack.initial-access
    - attack.t1190
    - cve.2021-44228
level: critical
---
title: Server-Side Template Injection Attempt
id: d0013758-bdcc-40c4-a2fb-c58ec751c575
status: experimental
author: LinHawk
logsource:
    category: webserver
detection:
    selection:
        UriDecoded|contains:
            - '{{7*7}}'
            - '${7*7}'
            - '<%= 7*7 %>'
            - '{{config'
            - '__class__.__mro__'
            - '__globals__'
            - 'T(java.lang.Runtime)'
            - 'freemarker.template.utility.Execute'
    condition: selection
tags:
    - attack.initial-access
    - attack.t1190
level: high
