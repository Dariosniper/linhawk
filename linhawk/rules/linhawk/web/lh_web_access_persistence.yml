title: Known Web Shell Accessed
id: 63fcfb56-446d-4960-8219-44246a2741ea
status: stable
author: LinHawk
logsource:
    category: webserver
detection:
    sel_names:
        cs-uri-stem|endswith:
            - /c99.php
            - /r57.php
            - /wso.php
            - /b374k.php
            - /alfa.php
            - /shell.php
            - /cmd.php
            - /cmd.jsp
            - /cmd.aspx
            - /webshell.php
            - /up.php
            - /mini.php
            - /x.php
            - /1.php
    sel_param:
        cs-uri-stem|re: '/(uploads?|images?|tmp|files|media|wp-content/uploads)/.*\.(php\d?|phtml|phar|jsp|jspx)$'
    sel_cmd:
        Query|re|i: '(^|&)(cmd|exec|command|execute|c|pass|act)='
    filter_404:
        sc-status: 404
    condition: (sel_names or (sel_param and sel_cmd)) and not filter_404
falsepositives:
    - Legitimate scripts with these names
tags:
    - attack.persistence
    - attack.t1505.003
level: high
