title: Suspicious Command Executed By Cron
id: b907570b-2c1d-4366-a53b-9e8571e1dc73
status: stable
author: LinHawk
logsource:
    product: linux
    service: cron
detection:
    selection:
        EventType: CRON_EXEC
        Command|contains:
            - 'curl '
            - 'wget '
            - '/dev/tcp/'
            - 'base64 -d'
            - 'base64 --decode'
            - 'nc -e'
            - '/tmp/'
            - '/dev/shm/'
    condition: selection
tags:
    - attack.persistence
    - attack.execution
    - attack.t1053.003
level: high
