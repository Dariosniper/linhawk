title: ld.so.preload Created
id: 369c4ab7-2072-411e-a3a0-1c2d3109d946
status: stable
description: /etc/ld.so.preload is a classic userland rootkit hook.
author: LinHawk
logsource:
    product: linux
    category: file_event
detection:
    selection:
        TargetFilename: /etc/ld.so.preload
    condition: selection
tags:
    - attack.persistence
    - attack.defense-evasion
    - attack.t1574.006
level: critical
