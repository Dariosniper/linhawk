title: User Created With UID 0
id: f797cdec-4fcd-4119-9dd0-b8a10880188d
status: stable
description: A new account with UID 0 is a root-equivalent backdoor.
author: LinHawk
logsource:
    product: linux
    service: auth
detection:
    selection:
        EventType: USER_CREATED
        TargetUid: '0'
    condition: selection
tags:
    - attack.persistence
    - attack.privilege-escalation
    - attack.t1136.001
level: critical
