title: Script Executed From Upload Directory
id: bb7433e4-463f-462f-9804-cd6116484fa7
status: experimental
description: Server-side script served from an upload folder with HTTP 200 - typical of uploaded web shells.
author: LinHawk
logsource:
    category: webserver
detection:
    selection:
        cs-uri-stem|re: '/(uploads?|images?|tmp|files|media|wp-content/uploads)/.*\.(php\d?|phtml|phar|jsp|jspx|asp|aspx)$'
        sc-status: 200
    condition: selection
tags:
    - attack.persistence
    - attack.t1505.003
level: medium
---
title: Sensitive File Disclosed By Web Server
id: 54b3ed2d-77dc-474d-8c41-c65cf2dc6649
status: stable
description: A secret or source-control file was served with HTTP 200 (exposure, not just an attempt).
author: LinHawk
logsource:
    category: webserver
detection:
    selection:
        cs-uri-stem|endswith:
            - /.env
            - /.git/config
            - /.git/HEAD
            - /.svn/entries
            - /.htpasswd
            - /.aws/credentials
            - /id_rsa
            - /wp-config.php.bak
            - /wp-config.php~
            - /config.php.bak
            - /.DS_Store
            - /backup.sql
            - /dump.sql
            - /database.sql
            - /phpinfo.php
            - /server-status
        sc-status: 200
        sc-bytes|gt: 0
    condition: selection
tags:
    - attack.collection
    - attack.credential-access
    - attack.t1552.001
level: high
