---
title: PHP Dangerous Function Error
id: d7cd7cae-a7b2-4b54-b844-c77e2be9e02b
status: experimental
description: Web server error log shows eval'd code or blocked execution functions - often web shell activity.
author: LinHawk
logsource:
    service: weberror
detection:
    keywords:
        - "eval()'d code"
        - 'system() has been disabled'
        - 'shell_exec() has been disabled'
        - 'passthru() has been disabled'
        - 'proc_open() has been disabled'
        - 'popen() has been disabled'
        - 'assert(): Assertion'
    condition: keywords
tags:
    - attack.execution
    - attack.persistence
    - attack.t1505.003
level: medium
