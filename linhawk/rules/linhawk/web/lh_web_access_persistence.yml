---
title: Web Content Discovery / Directory Brute Force
id: 985da18d-a056-4f9c-80a1-4877a0210ff9
status: stable
description: 100 or more HTTP 404 from the same client in 5 minutes.
author: LinHawk
correlation:
    type: event_count
    rules:
        - lh_web_404
    group-by:
        - SrcIP
    timespan: 5m
    condition:
        gte: 100
tags:
    - attack.reconnaissance
    - attack.discovery
    - attack.t1595.003
    - attack.t1083
level: medium
